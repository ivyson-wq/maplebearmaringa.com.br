  <p>Folder bonito todo mundo tem. O que separa uma escola da outra está na sala, no pátio e na portaria, e só aparece quando você visita com perguntas prontas. Este checklist tem 13 critérios, pensados para a família que escolhe a escola de uma criança de 5 a 10 anos, a passagem da educação infantil para o Fundamental I (Year 1 ao Year 5, o 1º ao 5º ano). Serve para qualquer escola da sua lista, a nossa inclusive.</p>
  <p>Se o seu filho é menor, o guia é outro: <a href="/blog/melhor-escola-educacao-infantil-maringa/">melhor escola de educação infantil em Maringá</a>. Para o panorama das opções particulares da cidade, a página <a href="/escola-particular-maringa/">escola particular em Maringá</a> reúne o essencial.</p>

  <h2 id="antes">Antes da lista: seu filho, sua rotina e a data de corte</h2>
  <p>Responda a três perguntas em casa, de preferência a quem divide a decisão com você:</p>
  <ul>
    <li><strong>Como é o seu filho?</strong> Mais tímido ou comunicativo, agitado ou calmo, precisa de tempo para se adaptar?</li>
    <li><strong>Como é o seu dia?</strong> Casa, trabalho e escola em Maringá precisam caber no horário de entrada e saída sem estresse.</li>
    <li><strong>Que idade escolar ele tem de fato?</strong> Para o 1º ano, a criança precisa ter 6 anos completos, ou fazê-los até 31 de março do ano da matrícula (Resolução CNE/CEB 2/2018, para todas as escolas). Confirme a turma antes de visitar.</li>
  </ul>
  <p>Com isso na mão, você sabe quais critérios pesam mais para a sua família.</p>

  <h2 id="criterios">Os 13 critérios, em quatro blocos</h2>
  <h3>Aprendizagem</h3>
  <div class="checklist-item">
    <div class="checklist-num">1</div>
    <div class="checklist-text"><strong>A escola explica a proposta em poucas frases?</strong><p>Peça o projeto pedagógico e escute como a equipe o resume. Quando a proposta é viva, qualquer profissional a conta com naturalidade, sem recitar texto decorado.</p></div>
  </div>
  <div class="checklist-item">
    <div class="checklist-num">2</div>
    <div class="checklist-text"><strong>Como ela acompanha e avalia o que a criança aprende?</strong><p>Prefira quem observa o processo ao longo do tempo, e não só quem soma notas. Pergunte que registros chegam à família e com que frequência.</p></div>
  </div>
  <div class="checklist-item">
