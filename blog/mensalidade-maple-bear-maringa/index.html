       O conteúdo do <article>
  <h1>Mensalidade da Maple Bear Maringá: o que entra na conta e como pedir a proposta</h1>
  <div class="article-meta">

    <span class="reading-badge">⏱ 7 min de leitura</span>

  <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=800&auto=format&fit=crop" alt="Família conversando sobre o investimento em educação bilíngue" class="cover-img" loading="eager">

  <p>"Quanto custa?" é a primeira pergunta de quase toda família, e é uma pergunta justa. Este artigo não traz valores: eles mudam por nível, por turno e por condição vigente, e um número escrito aqui ficaria velho em semanas. A proposta sai pelo <a href="https://wa.me/5544991783232" target="_blank" rel="noopener">WhatsApp (44) 99178-3232</a>, para o nível e o turno do seu filho.</p>
  <p>O que dá para fazer aqui, e vale mais do que um número solto, é mostrar o que muda a conta, o que você deve pedir por escrito em qualquer escola e o que costuma ficar fora da planilha. Quem chega com essa lista na mão compara propostas de verdade, não só mensalidades.</p>

  <div class="toc">

    <ol>
      <li><a href="#muda-a-conta">O que muda o valor de uma proposta</a></li><li><a href="#o-que-entrega">O que a mensalidade sustenta na prática</a></li><li><a href="#comparar">O que comparar entre duas propostas</a></li><li><a href="#lista">Lista para levar a qualquer escola</a></li><li><a href="#custo-real">O custo que a proposta não mostra: o dia inteiro da família</a></li><li><a href="#proposta">Como pedir a proposta e conhecer a escola</a></li><li><a href="#faq">Perguntas frequentes</a></li>
    </ol>

  <h2 id="muda-a-conta">O que muda o valor de uma proposta</h2>
  <p>Na Maple Bear Maringá, três escolhas da família definem a proposta:</p>
  <ul>
    <li><strong>O nível.</strong> A escola vai do Bear Care (a partir de 1 ano) ao Year 5, passando por Toddler, Nursery, Junior Kindergarten e Senior Kindergarten. O Year 6, início do Fundamental II, abre em 2027. Cada etapa tem rotina e equipe próprias; veja <a href="/niveis/infantil/">os níveis da educação infantil</a>.</li>
    <li><strong>O turno.</strong> Manhã, das 7h30 às 12h30, ou tarde, das 13h30 às 18h30. <strong>Não existe período integral</strong>: a criança estuda em um turno só. Isso simplifica a conta da escola, mas obriga a família a pensar no outro turno (voltamos a isso adiante).</li>
    <li><strong>As condições do momento.</strong> A equipe informa o que está valendo quando você pede a proposta, e vale perguntar quais condições existem para o seu caso. Pergunte, em vez de supor.</li>
  </ul>
  <p>Matrículas 2027 estão abertas, e as vagas são limitadas por turma. Por isso a proposta de hoje vale mais do que uma tabela de meses atrás.</p>

  <h2 id="o-que-entrega">O que a mensalidade sustenta na prática</h2>
  <p>Duas escolas bilíngues podem cobrar parecido e entregar coisas muito diferentes. Antes de olhar o número, olhe o que existe do outro lado dele. Na Maple Bear Maringá:</p>
  <ul>
    <li><strong>Inglês por imersão todos os dias</strong>, como língua da rotina e não como aula extra. A diferença para escola mais curso está em <a href="/blog/imersao-ingles-vs-aulas-ingles/">imersão ou aulas de inglês</a>.</li>
    <li><strong>Currículo canadense alinhado à BNCC</strong>, com continuidade do Bear Care ao Year 5. A criança não precisa trocar de escola a cada etapa; a escola passa a ter o 6º ano e abre uma série nova a cada ano.</li>
    <li><strong>Turmas reduzidas</strong>, com acompanhamento próximo. Quanto menor a turma, mais profissionais por criança, e esse é um dos fatores que mais pesam em qualquer escola. Veja <a href="/blog/escola-infantil-turmas-pequenas-maringa/">o que turma pequena muda</a>.</li>
    <li><strong>Alimentação inclusa</strong>, informação que a escola divulgou nas redes.</li>
    <li><strong>Salas com telas interativas</strong>, Reading Corner e novas salas abertas em 2026, que ampliaram o espaço.</li>
    <li><strong>Certificação Cambridge</strong> ao longo do percurso (a cerimônia de entrega de certificados Cambridge English foi em março de 2026) e o <strong>Duplo Diploma Maple Bear</strong>, Brasil e Canadá.</li>
  </ul>
  <p>Para pesar se isso compensa, leia também <a href="/blog/maple-bear-e-boa-vale-a-pena/">a Maple Bear vale a pena?</a>, que discute o ponto sem esconder as limitações, como a ausência de período integral.</p>

  <h2 id="comparar">O que comparar entre duas propostas</h2>
  <p>Ao receber propostas de escolas diferentes, a comparação justa não é "qual é mais barata", e sim "o que entra em cada uma". Quatro pontos explicam quase toda a diferença de valor entre escolas bilíngues:</p>
  <ol>
    <li><strong>Quantas horas de inglês a criança vive por dia</strong> e em que situações: roda de conversa, lanche, brincadeira, ou só uma aula.</li>
    <li><strong>Quem está na sala.</strong> Formação em metodologia, domínio do idioma e acompanhamento pedagógico entram no custo. Em <a href="/blog/professor-bilingue-o-que-avaliar/">o que avaliar no professor bilíngue</a> há perguntas para fazer na visita.</li>
    <li><strong>Tamanho da turma.</strong> Pergunte o número, anote e compare.</li>
    <li><strong>Continuidade.</strong> A proposta acompanha o aluno nos anos seguintes ou ele precisará mudar de escola no fim da educação infantil?</li>
  </ol>
  <div class="highlight-box">
    <strong>Regra simples:</strong> peça a proposta por escrito e compare linha a linha. Se uma escola inclui o que a outra cobra à parte, os números não são comparáveis até você somar tudo.
  </div>

  <h2 id="lista">Lista para levar a qualquer escola</h2>
  <p>Peça estas informações por escrito, na Maple Bear ou em qualquer outra:</p>
  <ul>
    <li>Mensalidade e número de parcelas no ano.</li>
    <li>Matrícula e rematrícula: se existem, quando são cobradas e se abatem algo.</li>
    <li>Material didático: o que está incluso e o que é comprado à parte.</li>
    <li>Uniforme: quais peças são obrigatórias.</li>
    <li>Alimentação: o que está incluso (aqui, a alimentação é inclusa).</li>
    <li>Atividades, passeios e eventos: o que faz parte da rotina e o que é opcional.</li>
    <li>Exames e certificados externos, como os de Cambridge, e se há cobrança específica.</li>
    <li>Reajuste anual: quando acontece e como é comunicado.</li>
    <li>Condições de pagamento e o que acontece se a família precisar sair no meio do ano.</li>
  </ul>
  <p>Se estiver montando uma comparação maior, o <a href="/blog/escolha-escola-particular-checklist/">checklist para escolher a escola particular</a> traz o que olhar na visita, além do preço.</p>

  <h2 id="custo-real">O custo que a proposta não mostra: o dia inteiro da família</h2>
  <p>Como a escola funciona em turnos, a conta real da família inclui a hora em que a criança não está lá. Quem trabalha o dia todo precisa decidir quem cobre o outro período, de manhã ou à tarde. Falamos disso com franqueza em <a href="/blog/escola-infantil-periodo-integral-maringa/">escola infantil em período integral em Maringá</a>: para algumas famílias isso decide a escolha, e é melhor saber antes da matrícula.</p>
  <p>Há também o trajeto. Pelos cálculos de rota da página <a href="/em-maringa/">Maple Bear em Maringá</a>, o caminho de carro até a escola leva cerca de 8 minutos saindo do Centro (Zona 1) e da Vila Operária, de 10 a 13 minutos da Zona 5, da Zona 7 e do Jardim Universitário, cerca de 15 a partir de Sarandi, 25 de Paiçandu e 29 de Marialva. São tempos arredondados para cima, com margem para o horário escolar. Some ida e volta, todos os dias, e você tem uma parte da conta que não aparece em nenhuma proposta.</p>
