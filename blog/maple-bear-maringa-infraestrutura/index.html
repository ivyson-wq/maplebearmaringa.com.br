  <p>Foto de escola é sempre bonita. O que ajuda a decidir é saber o que existe, para que serve e como observar se aquilo entra mesmo no dia da criança. Este guia percorre a estrutura da Maple Bear Maringá, no Jardim Higienópolis, e diz, espaço por espaço, o que olhar na visita.</p>
  <p>Só afirmamos aqui o que a escola publica. O resto, como a rotina de cada sala e o uso de cada espaço ao longo do dia, você vê de perto. E, antes de ir, vale assistir aos vídeos da página <a href="/estrutura/">Estrutura</a>, gravados pela equipe: o tour pelas salas novas e as telas interativas em uso.</p>

  <h2 id="salas">Salas novas: o espaço que a criança usa mais</h2>
  <p>Em 2026 a escola ampliou a estrutura, com novas salas. Uma sala boa para criança pequena não é a maior, e sim a que deixa a turma se mexer, ouvir a professora e achar o que precisa sem pedir. Vá com essa lista: dá para ouvir a professora sem ela levantar a voz? Há cantos de atividade diferentes? Os materiais estão em prateleiras baixas? Peça para ver a sala do nível do seu filho, do Bear Care ao Year 5, e não só a mais bonita.</p>

  <h2 id="telas">Telas interativas e Reading Corner no mesmo dia</h2>
  <p>As salas têm telas interativas, e a escola as apresenta como apoio para deixar o aprendizado mais dinâmico e ligado à vivência bilíngue. O mesmo prédio tem o Reading Corner, onde o livro é de papel. Observar os dois lado a lado mostra a proposta melhor do que qualquer descrição: se a tela é usada em pequenos momentos e o livro volta sempre à mão da criança, o equilíbrio está no lugar. Sobre o assunto, leia o guia <a href="https://maplebearmaringa.com.br/blog/escola-infantil-sem-telas-maringa/">escola infantil sem telas em Maringá</a>. E, sobre leitura, o que acontece depois do cantinho aparece na Book Signing Night, quando alunos autores assinam as páginas dos próprios livros com as famílias presentes.</p>

  <h2 id="externo">Parquinho e área verde: sol, sombra e frequência</h2>
  <p>Em Maringá, o sol aperta: de dezembro a março a máxima média gira em torno de 29 a 30 °C. Para uma escola com turno da tarde, das 13h30 às 18h30, a pergunta prática é: onde as crianças ficam quando o sol está forte, e a que horas o parquinho é usado? Peça para ver as sombras, a água ao alcance e o piso. Pergunte, por fim, com que frequência cada turma usa a área verde com quiosque, porque espaço bonito parado não educa.</p>

  <h2 id="seguranca">Segurança que se treina</h2>
  <p>Portão e câmeras são o que todo mundo pergunta. O que pouca família pergunta é se a equipe ensaia. A Maple Bear Maringá fez o treinamento de abandono de área para que os adultos saibam agir com organização e tranquilidade numa emergência. Um exemplo recente e real: depois da tempestade que atingiu a cidade em 2 de novembro de 2026, a escola avisou que as aulas seguiam normais no dia 3, com o prédio verificado antes de receber os alunos. Pergunte na visita como a escola comunica situações assim às famílias. O guia completo está em <a href="https://maplebearmaringa.com.br/blog/escola-infantil-segura-maringa/">escola infantil segura em Maringá: 9 pontos para conferir</a>.</p>

  <h2 id="refeicao">Alimentação inclusa: o que perguntar</h2>
  <p>A alimentação é inclusa na escola. O que conta saber na visita é o que não aparece em folder: onde as crianças fazem as refeições, quem acompanha, como as restrições e alergias são registradas e como a família é avisada. Não vamos descrever cardápio aqui; peça para conhecer a rotina da refeição com a equipe.</p>

    <li>Assista aos vídeos da página <a href="/estrutura/">Estrutura</a> antes e anote o que quer ver de perto.</li>
    <li>Vá num dia comum, com a escola funcionando, no turno que o seu filho usaria: manhã, das 7h30 às 12h30, ou tarde, das 13h30 às 18h30.</li>
    <li>Peça a sala do nível do seu filho e acompanhe um momento de transição, como a chegada ou o lanche.</li>
