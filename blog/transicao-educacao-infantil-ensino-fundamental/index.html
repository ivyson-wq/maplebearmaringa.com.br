  <h1>Da Educação Infantil ao 1º ano: como preparar a criança e a família</h1>
  <div class="article-meta">

    <span class="reading-badge">⏱ 6 min de leitura</span>

  </div>

  <img src="https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=800&auto=format&fit=crop" alt="Crianças caminhando para a escola com mochilas, no início do Ensino Fundamental" class="cover-img" loading="eager">

  <p>No último ano da educação infantil, quase toda família faz a mesma pergunta em voz baixa: "será que ele está pronto para o 1º ano?". A pergunta costuma ser maior do que o problema. A passagem para o Fundamental muda a rotina, mas não pede uma criança diferente da que já existe. Pede uma criança segura, que se vira com as próprias coisas e continua curiosa.</p>

  <p>Este texto é para a família: o que muda no dia a dia, como reconhecer prontidão sem aplicar teste, e um roteiro de agosto a março com coisas que cabem na rotina de casa. O que a escola faz na formatura e na chegada ao Year 1 está no artigo sobre a <a href="/blog/formatura-senior-kindergarten-year-1/">formatura do Senior Kindergarten</a>; aqui o foco é o seu papel e o da criança.</p>

  <h2 id="muda">O que muda de verdade no 1º ano</h2>

  <p>A essência é a mesma, cuidar e ensinar, mas a organização do dia ganha estrutura. Quatro mudanças aparecem primeiro:</p>

  <table>
    <thead>
      <tr><th>Aspecto</th><th>Educação infantil</th><th>1º ano</th></tr>
    </thead>
    <tbody>
      <tr><td>Tempo de tarefa</td><td>Atividades curtas, com muito brincar</td><td>Momentos mais longos de trabalho sentado e em silêncio</td></tr>
      <tr><td>Leitura e escrita</td><td>Letras, sons e histórias sem cobrança formal</td><td>Alfabetização sistemática, com registro escrito crescente</td></tr>
      <tr><td>Materiais</td><td>O adulto ajuda a organizar</td><td>A criança cuida de caderno, estojo e agasalho</td></tr>
      <tr><td>Combinados</td><td>Rotina flexível</td><td>Mais regras de sala, de recreio e de saída</td></tr>
    </tbody>
  </table>

  <p>O brincar não acaba. O que muda é o grau de sistematização, e é por isso que o preparo que mais funciona é o de rotina e de autonomia, não o de conteúdo.</p>

  <h2 id="pronto">O que conta como estar pronto</h2>

  <p>É comum achar que preparar para o 1º ano é antecipar a lição: treinar letra cursiva, decorar a tabuada. Nenhuma criança precisa disso para começar. Os sinais que realmente pesam no primeiro mês são mais simples:</p>

  <ul>
    <li><strong>Conta o que viveu.</strong> Descreve o dia em frases, mesmo que misture palavras.</li>
    <li><strong>Resolve o básico sozinha.</strong> Abre a lancheira, vai ao banheiro, pede ajuda com palavras.</li>
    <li><strong>Fica com uma tarefa por alguns minutos.</strong> Ouve uma história até o fim e espera a vez.</li>
    <li><strong>Lida com a frustração.</strong> Pode chorar, mas se recompõe com acolhimento.</li>
    <li><strong>Pega o lápis, recorta, desenha.</strong> A firmeza vem com o tempo; o interesse é o que importa.</li>
  </ul>

  <div class="highlight-box">
    <strong>🍁 Sem teste de prontidão:</strong> nenhuma criança chega firme em todos os pontos. A idade de entrada no Year 1 segue a regra nacional de corte (6 anos completos ou a completar até 31 de março), e a leitura da professora sobre o conjunto vale mais do que qualquer lista.
  </div>

  <h2 id="roteiro">Roteiro para a família, de agosto a março</h2>

  <p>O calendário abaixo vale para quem está no último ano da educação infantil. Ajuste ao seu ritmo; nada aqui exige tempo extra.</p>

  <ul>
    <li><strong>Agosto a outubro: autonomia.</strong> Peça que ela arrume a própria mochila, escolha a roupa do dia seguinte e leve a lancheira até a cozinha. Cada tarefa que sai das suas mãos é uma a menos no 1º ano.</li>
    <li><strong>Outubro e novembro: leitura.</strong> Vinte minutos de história antes de dormir, no idioma em que você se sente à vontade. A criança que ouve histórias com regularidade lê melhor depois, e o hábito importa mais do que o idioma.</li>
    <li><strong>Dezembro: fechar a etapa.</strong> Assista à formatura e à apresentação de fim de ano com a criança e converse sobre o que ela mais gostou. Despedir-se bem de uma fase ajuda a começar a outra.</li>
    <li><strong>Janeiro: reaproximar o sono.</strong> Nas férias o horário escorrega. Uma ou duas semanas antes da volta, traga a hora de dormir para a que o turno exige.</li>
    <li><strong>Antes do primeiro dia: o trajeto.</strong> Faça o caminho de casa até a escola, na hora real da entrada. Nos bairros centrais que calculamos, o carro leva de 8 a 13 minutos até a escola, mas o trânsito do horário escolar muda isso; os tempos por bairro estão em <a href="/em-maringa/">Maple Bear em Maringá</a>.</li>
    <li><strong>Fevereiro e março: acompanhar.</strong> Pergunte do dia com perguntas específicas ("qual foi a parte mais divertida?") e mantenha uma hora tranquila depois da escola.</li>
  </ul>

  <p>Evite frases como "no 1º ano não pode mais brincar". A criança entende como ameaça. Diga o que é verdade e animador: vai ler e escrever mais, vai fazer projetos, vai continuar com colegas que já conhece.</p>

  <h2 id="escola">O que a Maple Bear Maringá faz nessa passagem</h2>

  <p>A escola trata a transição da educação infantil para o Fundamental como um dos momentos mais importantes da jornada. Como o Fundamental I vai do Year 1 ao Year 5 na mesma escola, a criança do Senior Kindergarten muda de sala e de professora, mas não de escola, e segue com o inglês todos os dias e o currículo alinhado à BNCC. O horário também permanece: turmas de manhã (7h30 às 12h30) ou de tarde (13h30 às 18h30), sem período integral.</p>

  <p>Um sinal concreto dessa continuidade é a Book Signing Night. Em julho de 2026, o Senior e o Junior Kindergarten tiveram a sua noite, com os alunos assinando as páginas dos próprios livros, e o Year 1 e o Year 2 tiveram outra. Quem sai do Senior Kindergarten já conhece o ritual de ser autor e chega ao Year 1 sabendo que escrever é uma coisa que se mostra para a família. Veja como isso funciona em <a href="/blog/book-signing-night-criancas-autoras/">Book Signing Night: quando a criança vira autora</a>.</p>

  <p>E quando a criança vem de outra escola e nunca teve inglês? A escola acolhe crianças sem experiência prévia, e a metodologia estimula o aprendizado de forma natural. Para o Year 1, o ponto de partida é o mesmo de quem estava na casa: aprender a ler e a escrever. Se a chegada for no Year 3, 4 ou 5, vale ler <a href="/blog/entrar-escola-bilingue-sem-ingles-year-3-4-5/">entrar na escola bilíngue sem saber inglês aos 8, 9 ou 10 anos</a>.</p>

  <div class="inline-cta">
  <h3>💡 Quer ver o Year 1 na prática?</h3>
  <p>Recebemos visitas num dia comum de aula, de manhã e à tarde, agendadas pelo WhatsApp.</p>
  <a href="https://wa.me/5544991783232?text=Ol%C3%A1!%20Li%20o%20artigo%20sobre%20a%20transi%C3%A7%C3%A3o%20para%20o%201%C2%BA%20ano%20e%20gostaria%20de%20agendar%20uma%20visita." class="cta-btn" target="_blank">Agendar visita pelo WhatsApp</a>
</div>

  <h2 id="conversa">O que contar para a professora</h2>

  <p>Nas primeiras semanas, a professora vê a criança em grupo; só você a vê em casa. Duas ou três informações dadas cedo poupam semanas de tentativa e erro:</p>

  <ul>
    <li>Do que ela gosta e do que foge (histórias, desenho, jogos de movimento).</li>
    <li>Como reage a despedidas e a barulho: se demora a se soltar, se se retrai ou se agita.</li>
    <li>Como está o sono e a alimentação nas semanas de mudança.</li>
    <li>O que mudou em casa: nascimento de irmão, mudança, viagem longa. Sem detalhes que você não queira dividir; o essencial basta.</li>
  </ul>

  <p>A conversa também serve ao contrário: peça que a professora diga o que está vendo. As duas visões se completam.</p>

  <h2 id="meses">Os primeiros meses: o que é normal</h2>

  <p>É normal chegar cansada nas primeiras semanas, alternar dias de euforia com dias de choro e dizer "não quero mais ir" uma vez ou outra. Costuma passar quando a rotina fica previsível. Valorize o esforço, não só o resultado, e mantenha um horário calmo depois da escola.</p>

  <p>Procure a professora se, por várias semanas seguidas, houver recusa persistente de ir, dores sem causa aparente ou mudança forte de humor. Se a ansiedade for intensa, converse também com o pediatra. Sobre sinais de ansiedade nessa idade, veja <a href="/blog/ansiedade-infantil-escola-sinais/">ansiedade infantil na escola</a>.</p>

  <h2 id="faq">Perguntas frequentes</h2>

  <details>
    <summary>Meu filho precisa saber ler e escrever antes de entrar no 1º ano?</summary>
    <p>Não. A alfabetização formal é construída ao longo do 1º ano e dos seguintes. O que ajuda é ele chegar curioso por letras e histórias, reconhecendo o próprio nome e gostando de ouvir leitura.</p>
  </details>

  <details>
    <summary>Como saber se meu filho está pronto para o Year 1?</summary>
    <p>Em vez de procurar um teste, observe o conjunto: ele se separa de você com tranquilidade, participa de atividades em grupo, pede ajuda e se expressa? A professora, que o acompanha em grupo, é quem tem a melhor visão do todo.</p>
  </details>

  <details>
    <summary>Se meu filho faz aniversário depois de 31 de março, ele pode entrar no Year 1?</summary>
    <p>A regra nacional de corte pede 6 anos completos ou a completar até 31 de março do ano da matrícula, e vale para escolas públicas e particulares. Para o caso do seu filho, confirme com a secretaria da escola.</p>
  </details>

  <details>
    <summary>A transição é mais difícil para crianças de escola bilíngue?</summary>
    <p>Não costuma ser. Se a criança já conhece a rotina escolar e o inglês no dia a dia, a mudança de etapa é sentida mais como crescimento do que como ruptura. Na Maple Bear Maringá, o Fundamental I vai do Year 1 ao Year 5, no mesmo ambiente de convivência.</p>
  </details>

  <details>
    <summary>O que fazer se meu filho ficar ansioso com a mudança?</summary>
    <p>Converse com palavras simples, leia histórias sobre o tema, mostre o caminho da escola e mantenha rotinas estáveis em casa. Se a ansiedade for intensa ou persistir, fale com a professora e, se for o caso, com o pediatra.</p>
  </details>

  <details>
    <summary>Quando começar a conversar com a escola sobre a transição?</summary>
    <p>Já no ano do Senior Kindergarten. Quem ainda não conhece a escola e está pensando no 1º ano pode agendar uma visita pelo WhatsApp e entender como funciona; vagas e datas dependem da secretaria.</p>
  </details>

  <h2 id="conclusao">Em resumo</h2>

  <p>A passagem para o 1º ano é uma etapa de crescimento, não uma prova. Uma criança que se vira com as próprias coisas, gosta de histórias e confia nos adultos já tem o que precisa. O resto se constrói com a família e a escola, num ritmo que a criança consegue acompanhar.</p>
