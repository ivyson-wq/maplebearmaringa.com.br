  <img src="https://images.unsplash.com/photo-1503676260728-1c00da094a0b?w=800&auto=format&fit=crop" alt="Crianças em sala de aula bilíngue no Fundamental I" class="cover-img" loading="eager">

  <p>O Fundamental I é o momento em que a criança aprende a ler, escrever, calcular e pensar de forma estruturada. Numa escola bilíngue, as famílias chegam a ele com perguntas bem práticas: meu filho dá conta de aprender em dois idiomas? O conteúdo é o mesmo? Como vou saber se o inglês está avançando?</p>

  <p>Na Maple Bear Maringá, o Fundamental I vai do Year 1 ao Year 5 (1º ao 5º ano). Este texto mostra o que cada Year trabalha, como o inglês é acompanhado, o que a escola faz em eventos como a Book Signing Night e o que muda em 2027, quando o Year 6 abre e a escola inaugura o Fundamental II.</p>

  <h2 id="year">O que cada Year trabalha</h2>

  <p>A página do <a href="/niveis/fundamental-1/">Fundamental I</a> resume o foco de cada ano. Em casa, o que vale observar muda de uma etapa para outra:</p>

  <table>
    <thead>
      <tr><th>Ano</th><th>Foco da escola</th><th>O que a família costuma notar</th></tr>
    </thead>
    <tbody>
      <tr><td>Year 1 (1º ano)</td><td>Alfabetização inicial: leitura e escrita em português e em inglês, matemática concreta, investigação científica guiada</td><td>Canta em inglês pela casa; mistura as duas línguas na mesma frase; chega cansada nas primeiras semanas</td></tr>
      <tr><td>Year 2 (2º ano)</td><td>Consolidação: fluência crescente nos dois idiomas, produção de texto, raciocínio matemático ampliado</td><td>Lê sozinha livros curtos; escreve pequenos relatos</td></tr>
      <tr><td>Year 3 (3º ano)</td><td>Pensamento estruturado: projetos investigativos, primeiras argumentações escritas e orais</td><td>Defende uma ideia e explica o porquê</td></tr>
      <tr><td>Year 4 (4º ano)</td><td>Aprofundamento: disciplinas mais densas, trabalhos colaborativos em projetos multidisciplinares</td><td>Divide tarefas em grupo; precisa de mais organização</td></tr>
      <tr><td>Year 5 (5º ano)</td><td>Transição: autonomia acadêmica e pensamento independente, com preparação para o Fundamental II</td><td>Planeja o próprio estudo; pergunta sobre o que vem depois</td></tr>
    </tbody>
  </table>

  <p>A mistura de idiomas no Year 1 tem nome, code-switching, e é parte normal do processo: a criança escolhe a palavra que tem à mão. Não indica confusão. Se a dúvida é essa, veja <a href="/blog/escola-bilingue-confunde-crianca/">escola bilíngue confunde a criança?</a>.</p>

  <h2 id="bncc">BNCC e inglês na mesma rotina</h2>

  <p>O currículo é canadense e está alinhado à BNCC, a base nacional que vale para todas as escolas do país. Parte das aprendizagens passa pelo inglês, que dá à criança uma segunda forma de pensar sobre o mesmo assunto. O português tem seu lugar: a alfabetização em língua portuguesa segue o que a BNCC pede, e nos primeiros anos é normal que o português ainda seja o idioma mais forte nos textos escritos.</p>

  <p>Um dado de contexto ajuda a entender o que é diferente aqui. Pela LDB, a oferta de língua inglesa no currículo do ensino fundamental é obrigatória a partir do 6º ano. Na Maple Bear Maringá, o inglês está presente desde a educação infantil e todos os dias, dentro da rotina, e não como aula extra. Quando a criança chega ao Year 6, ela já tem cinco anos de inglês no Fundamental I, além do que viveu no Infantil.</p>

  <div class="highlight-box">
    <strong>🍁 O jeito canadense de ensinar:</strong> a criança aprende investigando perguntas, trabalhando em projetos e dividindo tarefas com os colegas. O inglês aparece dentro dessas atividades, e não em listas para decorar. Para ir mais fundo, leia <a href="/blog/metodologia-canadense-maple-bear/">a metodologia canadense da Maple Bear</a>.
  </div>

  <h2 id="cambridge">Cambridge: a medida de fora</h2>

  <p>Uma escola bilíngue séria precisa mostrar o progresso do inglês de um jeito que a família consiga enxergar. Na Maple Bear Maringá, os exames Cambridge fazem parte do percurso, e em 5 de março de 2026 a escola realizou a cerimônia de entrega dos certificados Cambridge English a alunos. É uma medida externa e reconhecida, que complementa o que a professora observa no dia a dia.</p>

  <p>Dois cuidados valem para qualquer família. O primeiro é não tratar o exame como meta de nota: a ideia é que a criança use o idioma, não que decore fórmulas de prova. O segundo é lembrar que o ritmo muda de criança para criança, e a escola não promete um nível fechado ao final do Year 5. Para entender os níveis e como o preparo funciona, veja <a href="/blog/cambridge-para-criancas/">Cambridge para crianças: Starters, Movers e Flyers</a>.</p>

  <h3>🌟 Quer ver uma aula do Fundamental I?</h3>
  <p>Recebemos visitas num dia comum de aula, de manhã e à tarde. É só agendar pelo WhatsApp.</p>

  <h2 id="livros">Ler e escrever em dois idiomas</h2>

  <p>O melhor retrato do Fundamental I bilíngue talvez seja a Book Signing Night. Em julho de 2026, os alunos do Year 1 e do Year 2 assinaram as páginas dos próprios livros, com apoio dos teachers e das famílias presentes. A criança que escreveu uma história, ilustrou e depois a autografa para os pais entende por que escrever vale o esforço. O texto <a href="/blog/book-signing-night-criancas-autoras/">Book Signing Night: quando a criança vira autora</a> conta como estimular o mesmo em casa.</p>

  <p>A escola também publica dicas de leitura em família. Vinte minutos de história antes de dormir, em português ou em inglês, ensinam mais sobre leitura do que qualquer cartilha. Não é preciso falar inglês: mostrar interesse e pedir que a criança conte o que leu ou ouviu já reforça o que ela aprendeu.</p>

  <h2 id="year6">Depois do Year 5: o Year 6 abre em 2027</h2>

  <p>Em janeiro de 2026, a escola atendia até o 5º ano e informou que, a cada ano, uma nova série seria adicionada, para que a criança não precise mudar de escola. Em 2027, o Year 6 abre e inaugura o Ensino Fundamental II, mantendo a proposta bilíngue. Para a família que tem um filho no Year 3 ou no Year 4, isso muda a conta: o percurso até o 6º ano pode continuar no mesmo lugar.</p>

  <p>O Year 5 é descrito pela escola como um ano de transição, com preparação para o Fundamental II. Os detalhes do 6º ano estão em <a href="/fundamental-2-maringa/">Fundamental II em Maringá</a>. Vagas e datas dependem da secretaria; a conversa começa pelo WhatsApp.</p>

  <h2 id="rotina">Turno, trajeto e rotina</h2>

  <p>As turmas funcionam de manhã (7h30 às 12h30) ou de tarde (13h30 às 18h30). Não há período integral. Para a família, vale decidir o turno antes da matrícula, pensando no caminho: nos bairros centrais que calculamos, o carro leva de 8 a 13 minutos até a escola, e Sarandi fica a cerca de 15 minutos, com margem para o horário escolar. Os tempos por bairro estão em <a href="/em-maringa/">Maple Bear em Maringá</a>.</p>

  <p>Quem tem filhos em etapas diferentes encontra no mesmo endereço do Bear Care ao Year 5, o que simplifica a logística. Sobre lição de casa e organização do estudo, veja <a href="/blog/licao-de-casa-escola-bilingue/">lição de casa em escola bilíngue</a>.</p>

  <h2 id="casa">Como a família acompanha</h2>

  <p>Você não precisa falar inglês para acompanhar o Fundamental I. O que mais pesa é o clima em casa: a criança que encontra alguém curioso para ouvir o que aprendeu se sente mais segura para usar o idioma.</p>

  <ul>
    <li><strong>Peça que ela ensine.</strong> Explicar uma palavra, uma música ou um experimento fixa o que aprendeu.</li>
    <li><strong>Evite comparar.</strong> Um colega ler antes não diz nada sobre o seu filho; a escola avança passo a passo, com suporte individual.</li>
    <li><strong>Converse com a escola.</strong> Os registros e as reuniões mostram onde a criança está e o que reforçar.</li>
    <li><strong>Comemore a coragem.</strong> Frase meio torta em inglês vale mais que silêncio.</li>
  </ul>

  <p>Se o seu filho tem 8, 9 ou 10 anos e nunca teve inglês na escola, a chegada ao Year 3, 4 ou 5 pede um olhar específico. Veja <a href="/blog/entrar-escola-bilingue-sem-ingles-year-3-4-5/">entrar na escola bilíngue sem inglês no Year 3, 4 ou 5</a>.</p>

  <h2 id="faq">Perguntas frequentes</h2>

  <details>
    <summary>O Fundamental I bilíngue segue a BNCC?</summary>
    <p>Sim. A Maple Bear Maringá mantém o currículo nacional (BNCC) e acrescenta o inglês por imersão, com materiais próprios desenvolvidos no Canadá. Parte dos conteúdos é trabalhada em inglês, sem substituir o currículo brasileiro.</p>
  </details>

  <details>
    <summary>Meu filho mistura português e inglês no Year 2. Isso é normal?</summary>
    <p>Sim. Alternar os idiomas na mesma frase, o code-switching, mostra que a criança usa tudo o que sabe para se comunicar. Com a convivência diária, ela passa a separá-los com mais naturalidade.</p>
  </details>

  <details>
    <summary>Que nível de inglês meu filho terá no final do Year 5?</summary>
    <p>Depende do ponto de partida, da frequência de contato e do ritmo de cada criança, por isso a escola não faz promessas fechadas. Os exames Cambridge ao longo do percurso são a medida externa do progresso.</p>
  </details>

  <details>
    <summary>O que a escola faz depois do Year 5?</summary>
    <p>O Year 6 abre em 2027 e inaugura o Fundamental II, mantendo a proposta bilíngue. Detalhes de vagas e datas ficam com a secretaria, pelo WhatsApp (44) 99178-3232.</p>
  </details>

  <details>
    <summary>Meu filho vai entrar no Year 3 e nunca estudou inglês. Vai acompanhar?</summary>
    <p>A escola acolhe crianças sem experiência prévia com inglês, e a metodologia estimula o aprendizado de forma natural. O começo pode ser mais cansativo. Vale conversar com a coordenação antes da matrícula para entender como seria a chegada.</p>
  </details>

  <details>
    <summary>Existe período integral no Fundamental I?</summary>
    <p>Não. As turmas funcionam de manhã (7h30 às 12h30) ou de tarde (13h30 às 18h30).</p>
  </details>

  <h2 id="conclusao">Para fechar</h2>

  <p>No Fundamental I, a criança lê, escreve e raciocina com mais autonomia, e faz isso em dois idiomas, com projetos, trabalho em grupo e uma medida externa de progresso. O melhor próximo passo é conhecer as salas do Year 1 ao Year 5 num dia comum de aula.</p>
