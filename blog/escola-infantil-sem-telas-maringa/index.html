  <img src="https://images.unsplash.com/photo-1611532736597-de2d4265fba3?w=800&auto=format&fit=crop" alt="Criança pequena diante de uma tela, tema do debate sobre tecnologia na primeira infância" class="cover-img" loading="eager">

  <p>"Tem tela na rotina?" é uma das perguntas que mais chegam à visita de uma escola infantil. Faz sentido: muita criança já passa horas diante de vídeos em casa, e muito pai e muita mãe querem que a escola seja o lugar de brincar, conversar e mexer as mãos.</p>
  <p>Antes de qualquer outra coisa, a resposta honesta sobre a Maple Bear Maringá: não somos uma escola "sem telas". As salas de aula têm telas interativas. Este guia explica como pensar o assunto, o que a escola faz no lugar da tela e quais perguntas levar à visita, aqui ou em qualquer outra escola.</p>

  <h2 id="precisa">O que a criança pequena precisa para aprender</h2>
  <p>Crianças pequenas aprendem com o corpo inteiro: subir, empilhar, desenhar, encaixar, cantar, imitar, conversar. A base dos primeiros anos está em experiências reais, com materiais concretos e pessoas por perto. Toda tecnologia que entra nessa fase passa por um teste simples: ela ajuda a criança a fazer, perguntar, criar ou se relacionar, ou só ocupa o tempo dela?</p>
  <div class="highlight-box">
    <p><strong>Teste da pergunta:</strong> depois do momento com tecnologia, a criança conseguiu contar, mostrar ou fazer algo que não fazia antes? Se sim, o uso provavelmente foi bom.</p>
  </div>

  <h2 id="orientacoes">O que as orientações de saúde dizem</h2>
  <p>A Sociedade Brasileira de Pediatria (manual de orientação “#MenosTelas #MaisSaúde”, 2019) e entidades internacionais têm recomendações próximas. Confira sempre a versão mais recente com o pediatra do seu filho, mas, em linhas gerais:</p>
  <table>
    <thead>
      <tr><th>Fase</th><th>Cuidado geral</th><th>Na prática</th></tr>
    </thead>
    <tbody>
      <tr><td>Até 2 anos</td><td>Evitar telas, exceto videochamada com a família</td><td>Colo, voz, brincadeira e movimento são os melhores estímulos</td></tr>
      <tr><td>2 a 5 anos</td><td>Pouco tempo, conteúdo de qualidade e adulto junto</td><td>Quando houver tela, assistir junto e conversar sobre o que aparece</td></tr>
      <tr><td>Fundamental I</td><td>Uso combinado e planejado, com limites claros</td><td>A tela não pode tomar o lugar de sono, movimento, leitura e convivência</td></tr>
    </tbody>
  </table>
  <p>Esses limites valem para casa e escola somadas. Uma boa proposta pedagógica considera o tempo de tela do dia inteiro da criança, e não só o que acontece na sala. Para o lado de casa, o guia é <a href="https://maplebearmaringa.com.br/blog/screen-time-bilingue-criancas/">tempo de tela em casa para crianças bilíngues</a>.</p>

  <h2 id="ajuda">Quando a tecnologia ajuda e quando atrapalha</h2>
  <p><strong>Ajuda</strong> quando amplia o que já acontece na sala: mostrar o som de um animal que a turma não pode ver ao vivo, projetar uma história na roda, ouvir uma canção em inglês, registrar um projeto para a família ver. A criança continua ativa, conversando e criando.</p>
  <p><strong>Atrapalha</strong> quando substitui o brincar livre e o movimento, quando serve para acalmar ou "ocupar" a turma, quando o conteúdo é passivo e acelerado, ou quando cada criança fica isolada com o seu aparelho em vez de dividir descobertas com os colegas.</p>
  <p>Repare que "sem telas" não é, sozinho, sinal de qualidade. Uma escola sem tela e sem conversa, sem história e sem brincar também deixa a criança sem o que ela precisa.</p>

  <h2 id="maple-bear">O que a Maple Bear Maringá faz</h2>
  <p>As telas interativas estão nas salas de aula como apoio da professora, para tornar o aprendizado mais dinâmico e conectado à vivência bilíngue. Você pode ver o equipamento em uso nos vídeos da página <a href="/estrutura/">Estrutura</a>.</p>
  <p>No lugar do centro da aula, a escola põe o que a criança faz com o corpo e com a voz: inglês por imersão todos os dias, por músicas, histórias, brincadeiras e projetos, em turmas reduzidas e com acompanhamento próximo. Existe o Reading Corner, um cantinho de leitura. E, na Book Signing Night, os alunos do Junior e do Senior Kindergarten e do Year 1 e 2 assinaram as páginas dos próprios livros com as famílias presentes, o contrário de uma experiência diante de tela.</p>
  <p>O que não publicamos é um número de minutos por turma. Esse tempo varia com a idade e com a atividade, e prometer um número sem você ter visto a sala seria vender o que não dá para conferir. Pergunte, e observe.</p>

    <h3>Quer ver como a tela entra na rotina?</h3>
    <p>Agende uma visita num dia comum de aula e peça exemplos reais da sua faixa etária, em vez de uma resposta geral.</p>

  <h2 id="perguntas">Perguntas para levar à visita</h2>
  <ul>
    <li>Há tela na rotina das crianças menores de 2 anos? O que muda para as turmas do Bear Care?</li>
    <li>Para as maiores, quem escolhe o conteúdo, por quanto tempo e com qual objetivo?</li>
    <li>A tela é usada em algum momento para "ocupar" a turma, por exemplo na espera ou na troca de atividade?</li>
    <li>O que as crianças fazem na maior parte do tempo: brincar, conversar, ouvir histórias, mexer em materiais?</li>
    <li>A escola orienta a família sobre telas em casa?</li>
    <li>Posso observar uma atividade completa, da chegada à saída?</li>
  </ul>
  <p>Observe, em especial, os momentos de transição e de espera. É ali que se vê se a tela está servindo à proposta ou ao relógio.</p>

  <h2 id="ingles">Tela e inglês: mais tela não é mais inglês</h2>
  <p>Numa escola bilíngue, é tentador achar que mais tela significa mais inglês. A língua se consolida quando a criança é ouvida, responde, brinca e se arrisca com as palavras, e isso precisa de gente. Por isso a imersão da escola acontece na convivência com professoras e colegas, e a tecnologia fica como ilustração e motivação. Para a visão geral do método, veja <a href="https://maplebearmaringa.com.br/blog/imersao-ingles-vs-aulas-ingles/">imersão em inglês ou aulas de inglês</a>.</p>

  <h2 id="faq">Perguntas frequentes</h2>

  <details>
    <summary><strong>A Maple Bear Maringá é uma escola sem telas?</strong></summary>
    <p>Não. As salas de aula têm telas interativas, usadas como apoio da professora. A rotina se baseia em imersão em inglês por músicas, histórias, brincadeiras e projetos, com Reading Corner para o contato diário com livros. Para ver como cada faixa etária usa a tecnologia, visite num dia comum de aula.</p>
  </details>

  <details>
    <summary><strong>A partir de que idade a criança pode ter contato com telas?</strong></summary>
    <p>As entidades de saúde recomendam evitar telas antes dos 2 anos e limitar o uso depois disso, sempre com um adulto junto e conteúdo adequado. Confirme a orientação atual com o pediatra do seu filho.</p>
  </details>

  <details>
    <summary><strong>Escola sem tela é melhor?</strong></summary>
    <p>Não necessariamente. O que conta é o que a criança vive no lugar da tela: conversa, brincadeira, movimento e histórias. Uma escola sem tela e sem propostas ricas não entrega mais.</p>
  </details>

  <details>
    <summary><strong>Como saber se a escola usa tela para ocupar as crianças?</strong></summary>
    <p>Visite num dia comum e observe os momentos de transição e de espera. Pergunte também à equipe quem escolhe o conteúdo e por quanto tempo, e desconfie de respostas evasivas.</p>
  </details>

  <details>
    <summary><strong>Como reduzir telas em casa?</strong></summary>
    <p>Combine horários e lugares sem tela, como refeições e quarto, ofereça alternativas concretas, como livros, jogos e brincadeira ao ar livre, e dê o exemplo. O guia sobre tempo de tela em casa detalha essas estratégias.</p>
  </details>
