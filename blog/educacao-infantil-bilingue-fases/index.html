  <p>"Ele já está pronto?", "e se ainda nem fala direito em português?", "o que uma criança de dois anos faz o dia inteiro em inglês?". Essas perguntas aparecem em toda conversa de família que avalia escola para um filho pequeno, e a resposta começa por entender como a educação infantil se organiza por dentro.</p>

  <p>Na Maple Bear Maringá, ela tem cinco turmas: Bear Care, Toddler, Nursery, Junior Kindergarten e Senior Kindergarten, equivalentes ao Infantil 1 a 5. Este guia percorre as cinco, diz que idade corresponde a cada uma e mostra o que a família pode observar numa visita. Para o fim da jornada, quando a criança chega ao Year 1, há um artigo à parte sobre a <a href="/blog/formatura-senior-kindergarten-year-1/">formatura do Senior Kindergarten</a>.</p>

  <h2 id="fases">As cinco fases, uma a uma</h2>

  <p>O bilinguismo está presente desde cedo, e o foco muda a cada turma. A tabela resume; os parágrafos abaixo dão o contexto:</p>

  </table>

  <h3>Bear Care: o começo da jornada</h3>

  <p>É a turma de entrada, a partir de 1 ano. A escola o descreve como um ambiente preparado, com profissionais capacitados, atividades adequadas à infância e uma rotina que respeita o tempo de cada criança. O inglês aparece em músicas, rotinas e no nome das coisas, enquanto o português continua em casa. Os detalhes do turno estão em <a href="/blog/dia-a-dia-no-bear-care/">dia a dia no Bear Care</a>, e a chegada, em <a href="/blog/adaptacao-bear-care-1-ano/">adaptação no Bear Care</a>.</p>

  <h3>Toddler: a curiosidade e a fala</h3>

  <p>Entre uma turma e outra, a linguagem avança muito. A criança passa de palavras soltas para pequenas frases e quer nomear tudo. Canções, livros ilustrados e brincadeiras repetidas dão ao inglês um lugar natural nessa explosão de vocabulário. Ninguém obriga a criança a responder no outro idioma; ela fala quando se sente pronta.</p>

  <h3>Nursery: o mundo além da família</h3>

  <p>Nursery corresponde a 3 anos de idade. A escola descreve essa fase como aquela em que a criança explora o mundo e constrói os primeiros vínculos fora do ambiente familiar. É também quando aparecem o faz de conta, os pequenos diálogos e os projetos por tema.</p>

  <h3>Junior e Senior Kindergarten: rumo ao Fundamental</h3>

  <p>Nas duas últimas turmas, a curiosidade ganha direção. A criança reconhece letras e sons, começa a escrever o nome e palavras simples e acompanha histórias mais longas. As duas turmas participam da Book Signing Night, quando os alunos assinam as páginas dos próprios livros com as famílias presentes; em julho de 2026, o Junior e o Senior Kindergarten tiveram a sua noite. O Senior fecha a educação infantil com a formatura, e o Fundamental I segue no mesmo lugar, do Year 1 ao Year 5.</p>

  <h2 id="idade">Que idade, que turma: a regra de corte</h2>

  <p>Dos 4 aos 17 anos a educação básica é obrigatória no Brasil (Lei 12.796/2013), o que na prática significa que a pré-escola, que na escola corresponde ao Junior e ao Senior Kindergarten, é etapa obrigatória. Antes disso, a matrícula é escolha da família, e em Maringá ela convive com a oferta pública: os 64 CMEIs da rede municipal atendem cerca de 15 mil alunos de até 6 anos (Prefeitura de Maringá, 2024).</p>

  <p>A data de corte nacional é 31 de março: a criança precisa ter 4 anos (pré-escola) ou 6 anos (1º ano) completos, ou a completar até essa data, no ano da matrícula (Resolução CNE/CEB 2/2018). A regra vale para escolas públicas e particulares. Quem faz aniversário em abril ou depois fica, em geral, na turma anterior. Para saber qual turma cabe ao seu filho, confirme com a secretaria. Para decidir a idade de entrada, veja <a href="/blog/idade-certa-escola-bilingue/">qual a idade certa para escola bilíngue</a> e <a href="/blog/creche-maringa-idade-de-entrada/">creche em Maringá: com que idade colocar o filho</a>.</p>

</div>

  <h2 id="ingles">O inglês em cada fase</h2>

  <p>O inglês faz parte da rotina de forma natural, acompanhando cada etapa do desenvolvimento, e não é aula extra: a professora conversa, canta, conta histórias e dá comandos em inglês. A criança sem experiência prévia com o idioma é acolhida, e a metodologia estimula o aprendizado de forma natural.</p>

  <p>Duas dúvidas aparecem com frequência. A primeira é "ele vai entender?". Na maioria das vezes, sim: crianças pequenas leem tom de voz, rosto e gesto com muita competência. Quando a professora diz "time to wash your hands" apontando para a pia, ninguém precisa de tradução. A segunda é "ele vai misturar os idiomas?". Misturar é comum, o chamado code-switching, e não indica confusão; a escola trata inglês e português como uma jornada de aprendizado natural, respeitando o tempo de cada criança. Mais sobre isso em <a href="/blog/escola-bilingue-confunde-crianca/">escola bilíngue confunde a criança?</a>.</p>

  <h2 id="alem">O que a criança vive além do inglês</h2>

  <p>Escola bilíngue na primeira infância não é curso de idioma com uniforme. O currículo é canadense e alinhado à BNCC, e se ocupa do desenvolvimento como um todo:</p>

  <ul>
    <li><strong>Corpo e movimento:</strong> correr, pular, equilibrar, recortar, segurar o lápis.</li>
    <li><strong>Convivência:</strong> dividir brinquedos, esperar a vez, resolver desentendimentos com palavras.</li>
    <li><strong>Autonomia:</strong> guardar os pertences, lavar as mãos, pedir ajuda quando precisa.</li>
    <li><strong>Linguagem:</strong> contar o que aconteceu, ouvir histórias, brincar com rimas e sons nos dois idiomas.</li>
  </ul>

  <p>A escola repete o lema de que o cuidado vem antes do conteúdo: criança segura aprende. Esse cuidado inclui a segurança da equipe; ela faz treinamento de abandono de área para agir com organização e tranquilidade numa emergência. As turmas são reduzidas, com acompanhamento próximo, e o dia segue em dois turnos: manhã (7h30 às 12h30) ou tarde (13h30 às 18h30). Não há período integral. Para pensar a rotina de uma criança pequena, veja o <a href="/blog/turno-da-tarde-escola-infantil-maringa/">turno da tarde</a>.</p>

  <h2 id="visita">O que olhar na visita, fase a fase</h2>

  <p>Nada substitui ver a rotina de perto. O que observar muda conforme a idade do seu filho:</p>

  <ul>
    <li><strong>Bear Care e Toddler:</strong> a professora fala com a criança no nível dos olhos? A despedida é acolhedora? O espaço é pensado para quem engatinha, anda e explora?</li>
    <li><strong>Nursery:</strong> há espaço para faz de conta e conversa? O inglês aparece em situações reais, como cantar, pedir, contar?</li>
    <li><strong>Junior e Senior Kindergarten:</strong> há letras, livros e registros das crianças nas paredes? A criança tem tempo de brincar e tempo de sentar?</li>
    <li><strong>Em todas:</strong> a equipe sabe descrever, com exemplos, como cada criança está, ou repete frases genéricas?</li>
  </ul>

  <p>Quem mora nos bairros centrais leva de 8 a 13 minutos de carro até a escola, segundo os tempos calculados em <a href="/em-maringa/">Maple Bear em Maringá</a>; vale testar o trajeto no horário que será o seu. A visita é agendada pelo WhatsApp, e a criança pode ir junto.</p>

  <h2 id="faq">Perguntas frequentes</h2>

  <details>
    <summary>A partir de que idade posso colocar meu filho na escola bilíngue?</summary>
    <p>A educação infantil da Maple Bear Maringá começa no Bear Care, a partir de 1 ano. Não existe idade certa única: o que importa é o acolhimento, a rotina adequada e o inglês presente de forma suave. Converse com a equipe sobre a idade e o momento do seu filho.</p>
  </details>

  <details>
    <summary>Meu filho ainda não fala direito em português. Não é cedo para o inglês?</summary>
    <p>É uma preocupação comum. Na primeira infância, a criança é capaz de ouvir dois idiomas ao mesmo tempo, e o contato com o inglês não costuma atrapalhar o português. A escola não exige respostas em inglês. Se houver preocupação específica com a fala, vale conversar com o pediatra e com a equipe pedagógica.</p>
  </details>

  <details>
    <summary>Meu filho vai misturar os idiomas e ficar confuso?</summary>
    <p>Misturar palavras dos dois idiomas, o code-switching, é comum no desenvolvimento bilíngue e não indica confusão. Com o tempo, a criança percebe em qual contexto usar cada língua. Manter o português vivo em casa, com conversas e histórias, ajuda.</p>
  </details>

  <details>
    <summary>Como é a adaptação de uma criança pequena?</summary>
    <p>A adaptação é gradual e muda de criança para criança. No começo, choro e estranhamento são normais. Despedidas breves e carinhosas, rotina previsível e uma equipe que conversa com a família ajudam bastante.</p>
  </details>

  <details>
    <summary>O que muda do Senior Kindergarten para o Year 1?</summary>
    <p>A criança muda de etapa na mesma escola. A alfabetização ganha peso e a rotina fica mais organizada, e o inglês continua todos os dias. O artigo sobre a formatura do Senior Kindergarten detalha essa passagem.</p>
  </details>

  <details>
    <summary>A escola tem período integral na educação infantil?</summary>
    <p>Não. A criança estuda de manhã (7h30 às 12h30) ou de tarde (13h30 às 18h30).</p>
  </details>

  <h2 id="conclusao">Começar com calma também é escolher bem</h2>

  <p>A educação infantil bilíngue não é uma corrida contra o relógio. É um jeito de oferecer, nos primeiros anos, um ambiente em que duas línguas convivem com naturalidade, dentro de uma rotina de brincadeira, vínculo e descoberta. Do Bear Care ao Senior Kindergarten, cada fase respeita o que a criança consegue viver naquele momento.</p>

  <p>Se essa conversa fez sentido, o próximo passo é conhecer a escola, na Av. Arquiteto Nildo Ribeiro da Rocha, 1201, no Jardim Higienópolis. Comece pela página <a href="/visite/">Visite a escola</a>, veja o resumo das turmas em <a href="/niveis/infantil/">Educação Infantil</a> ou tire dúvidas na <a href="/faq/">página de perguntas frequentes</a>.</p>
